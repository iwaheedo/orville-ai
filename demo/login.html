<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Orville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfbfa;
  --bg-elev: #ffffff;
  --bg-sunken: #f5f5f4;
  --bg-hover: #f0f0ee;
  --bg-active: #e8e8e6;
  --line: #ebebe9;
  --line-strong: #dcdcd9;
  --line-soft: #f2f2f0;
  --fg: #0a0a0a;
  --fg-2: #3a3a38;
  --fg-3: #6b6b68;
  --fg-4: #9a9a96;
  --fg-5: #b8b8b4;
  --accent: #0a0a0a;
  --accent-fg: #ffffff;
  --accent-hover: #1f1f1f;
  --info: #2563eb;
  --bad: #dc2626;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --r-xl: 14px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
  --font-sans: "Inter Tight", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--fg);
  background: var(--bg);
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(rgba(10,10,10,0.035) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: -1px -1px;
}

.auth-shell {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
}

/* Topbar */
.auth-topbar {
  display: flex;
  align-items: center;
  padding: 18px 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: -0.02em;
}
.brand-name { font-size: 15px; }

.auth-topbar .spacer { flex: 1; }

.region-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-elev);
  color: var(--fg-2);
  font-size: 12px;
  cursor: pointer;
  transition: background 120ms, border-color 120ms;
}
.region-pill:hover { background: var(--bg-hover); border-color: var(--line-strong); }
.region-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #16a34a;
  box-shadow: 0 0 0 2px rgba(22,163,74,0.18);
}

/* Card */
.auth-main {
  display: grid;
  place-items: center;
  padding: 28px;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  padding: 32px 32px 28px;
}

.auth-card h1 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.auth-card .sub {
  margin: 0 0 24px;
  font-size: 13.5px;
  color: var(--fg-3);
}

/* SSO buttons */
.sso-list { display: grid; gap: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 40px;
  padding: 0 14px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--bg-elev);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:hover { background: var(--bg-hover); border-color: #c8c8c5; }
.btn:active { transform: translateY(0.5px); }
.btn.block { width: 100%; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn .icn { width: 16px; height: 16px; flex-shrink: 0; }

/* Divider */
.divider {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  margin: 18px 0;
}
.divider::before, .divider::after {
  content: "";
  height: 1px;
  background: var(--line);
}
.divider span {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-4);
}

/* Email field */
.field { display: grid; gap: 6px; }
.field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-2);
  letter-spacing: -0.005em;
}
.input {
  height: 40px;
  padding: 0 12px;
  font-family: inherit;
  font-size: 14px;
  color: var(--fg);
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  transition: border-color 120ms, box-shadow 120ms;
  width: 100%;
}
.input::placeholder { color: var(--fg-5); }
.input:hover { border-color: #c8c8c5; }
.input:focus {
  outline: none;
  border-color: var(--fg);
  box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
}

.email-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 6px;
}

/* Help block */
.helps {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12.5px;
  color: var(--fg-3);
}
.helps a {
  color: var(--fg-2);
  text-decoration: none;
  border-bottom: 1px solid var(--line-strong);
  padding-bottom: 1px;
}
.helps a:hover { color: var(--fg); border-color: var(--fg-3); }

/* Footer */
.auth-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  font-size: 12px;
  color: var(--fg-4);
}
.auth-footer .links { display: flex; gap: 16px; }
.auth-footer a { color: var(--fg-3); text-decoration: none; }
.auth-footer a:hover { color: var(--fg-2); }

.trust-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--fg-4);
  letter-spacing: 0.04em;
}
.trust-row .sep { color: var(--fg-5); }

/* Mono accent — picks up dashboard's voice */
.mono { font-family: var(--font-mono); }

@media (max-width: 520px) {
  .auth-card { padding: 26px 22px 22px; border-radius: var(--r-lg); }
  .auth-topbar, .auth-footer { padding-left: 18px; padding-right: 18px; }
}
</style>
</head>
<body>

<div class="auth-shell">

  <header class="auth-topbar">
    <div class="brand">
      <div class="brand-mark">O</div>
      <span class="brand-name">Orville</span>
    </div>
    <div class="spacer"></div>
    <button class="region-pill" type="button" title="Region">
      <span class="dot"></span>
      <span>UK · London</span>
      <svg class="icn" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </button>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">

      <h1 id="auth-title">Sign in to Orville</h1>
      <p class="sub">Air traffic decision intelligence for airline operations.</p>

      <div class="sso-list">
        <a class="btn primary block" href="dashboard.html" role="button">
          <svg class="icn" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1" y="1" width="6.5" height="6.5" fill="#f25022"/>
            <rect x="8.5" y="1" width="6.5" height="6.5" fill="#7fba00"/>
            <rect x="1" y="8.5" width="6.5" height="6.5" fill="#00a4ef"/>
            <rect x="8.5" y="8.5" width="6.5" height="6.5" fill="#ffb900"/>
          </svg>
          Continue with Microsoft
        </a>
        <a class="btn block" href="dashboard.html" role="button">
          <svg class="icn" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.61z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.29-1.71V4.96H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3.01-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.34l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </a>
      </div>

      <div class="divider"><span>or with work email</span></div>

      <form class="field" action="dashboard.html" method="get" novalidate>
        <label for="email">Work email</label>
        <div class="email-row">
          <input id="email" class="input" type="email" autocomplete="email" placeholder="name@your-airline.com" autofocus>
          <button class="btn primary" type="submit">
            Continue
            <svg class="icn" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </div>
      </form>

      <div class="helps">
        <a href="dashboard.html">Use SAML SSO</a>
        <a href="#" title="Trouble signing in?">Get help</a>
      </div>

    </section>
  </main>

  <footer class="auth-footer">
    <div class="trust-row">
      <span>GDPR</span>
      <span class="sep">·</span>
      <span>EASA-aware</span>
    </div>
    <div class="links">
      <a href="../">← Back to site</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <span class="mono" style="color: var(--fg-5);">v0.1</span>
    </div>
  </footer>

</div>

</body>
</html>
